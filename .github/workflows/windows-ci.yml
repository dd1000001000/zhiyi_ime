name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

# Builds the input method and its runtime dictionaries. Tests, development tools and the
# installer are not in the public repository.
jobs:
  build:
    name: Build x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: python scripts/fetch_onnxruntime.py

      - name: Build
        shell: cmd
        run: build.bat

      - name: Build runtime dictionaries
        shell: pwsh
        run: |
          python scripts/prepare_dictionary_bundle.py `
            --data-dir data `
            --output-dir data `
            --workers 2 `
            --topn-builder build/tools/topn_index/Release/topn_builder.exe
