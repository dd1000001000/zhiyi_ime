name: Windows Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build release installer
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ github.ref_name }}" -ne "v$version") {
              throw "Tag must be v$version"
          }

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: python scripts/fetch_onnxruntime.py

      - name: Build and package
        shell: pwsh
        run: |
          python scripts/package.py `
            --with-tests `
            --output-dir "$env:GITHUB_WORKSPACE\artifacts" `
            --generator "Visual Studio 17 2022" `
            --platform x64 `
            --jobs 4 `
            --dict-workers 2

      - name: Stage packaged data for tests
        shell: pwsh
        run: Copy-Item -Path "dist/data/*" -Destination "data" -Force

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-package -C Release --output-on-failure

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $file = Get-Item "$env:GITHUB_WORKSPACE\artifacts\cxxime-v$version-setup.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" |
            Set-Content "$env:GITHUB_WORKSPACE\artifacts\SHA256SUMS.txt" -Encoding ascii

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: cxxime-windows-${{ github.run_id }}
          path: ${{ github.workspace }}/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
