>77.3</text><text x="176" y="621" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+1.4V2-Long-L18</text><path d="M184,610 H330.0 Q334.0,610 334.0,614.0 V619.0 Q334.0,623 330.0,623 H184 Z" fill="#D6336C"><title>ng1017+1.4V2-Long-L18: 77.3</title></path><text x="340.0" y="621" font-size="12" font-weight="400" fill="#1F2330">77.3</text><text x="176" y="642" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">ng1017+1.4V2-Long-L12</text><path d="M184,631 H326.8 Q330.8,631 330.8,635.0 V640.0 Q330.8,644 326.8,644 H184 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 75.7</title></path><text x="336.8" y="642" font-size="12" font-weight="700" fill="#2F9E44">75.7</text><line x1="184" y1="522" x2="184" y2="648" stroke="#C9CDD6"/><text x="458" y="496" font-size="14" font-weight="700" fill="#1F2330">(f) CPU time per page</text><text x="458" y="513" font-size="11.5" fill="#6B7180">ms, median, 4 threads, lower is better</text><text x="606" y="537" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Frequency</text><text x="618" y="537" font-size="11.5" fill="#6B7180">no model</text><text x="606" y="558" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Original Laya</text><path d="M614,547 H804.0 Q808.0,547 808.0,551.0 V556.0 Q808.0,560 804.0,560 H614 Z" fill="#E0611A"><title>Original Laya: 43.3</title></path><text x="814.0" y="558" font-size="12" font-weight="400" fill="#1F2330">43.3</text><text x="606" y="579" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Zhiyi 1.4V2</text><path d="M614,568 H738.6 Q742.6,568 742.6,572.0 V577.0 Q742.6,581 738.6,581 H614 Z" fill="#0E9AA7"><title>Zhiyi 1.4V2: 28.7</title></path><text x="748.6" y="579" font-size="12" font-weight="400" fill="#1F2330">28.7</text><text x="606" y="600" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">1.4V2-Long-L18</text><path d="M614,589 H675.4 Q679.4,589 679.4,593.0 V598.0 Q679.4,602 675.4,602 H614 Z" fill="#6A5AE0"><title>1.4V2-Long-L18: 14.6</title></path><text x="685.4" y="600" font-size="12" font-weight="400" fill="#1F2330">14.6</text><text x="606" y="621" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+1.4V2-Long-L18</text><path d="M614,610 H675.9 Q679.9,610 679.9,614.0 V619.0 Q679.9,623 675.9,623 H614 Z" fill="#D6336C"><title>ng1017+1.4V2-Long-L18: 14.7</title></path><text x="685.9" y="621" font-size="12" font-weight="400" fill="#1F2330">14.7</text><text x="606" y="642" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">ng1017+1.4V2-Long-L12</text><path d="M614,631 H656.6 Q660.6,631 660.6,635.0 V640.0 Q660.6,644 656.6,644 H614 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 10.4</title></path><text x="666.6" y="642" font-size="12" font-weight="700" fill="#2F9E44">10.4</text><line x1="614" y1="522" x2="614" y2="648" stroke="#C9CDD6"/><text x="28" y="678" font-size="11.5" fill="#6B7180">Test set: text from SkyPile, LCCC, Chinese and English C4, SODA and Tatoeba with its preceding text, typed in full pinyin,</text><text x="28" y="695" font-size="11.5" fill="#6B7180">initials, mixed, or the first letters of a word; the candidates are the IME engine's own. Every third row (4175; scored where</text><text x="28" y="712" font-size="11.5" fill="#6B7180">the right word is among two or more candidates). End to end in the IME engine (after the pause), the model on the graphics card</text><text x="28" y="729" font-size="11.5" fill="#6B7180">(DirectML); in English word mode the typed text stays first, so the first word after it. Original Laya = convaiinnovations/laya</text><text x="28" y="746" font-size="11.5" fill="#6B7180">on Hugging Face (based on mmBERT-base, not fine-tuned by Zhiyi) ranking the candidates the IME's way.</text><text x="28" y="763" font-size="11.5" fill="#6B7180">Zhiyi 1.4V2-Long-L18 (1.5.9-1.5.11) = 1.4V2 without 4 sliding-window layers (18), word choice distilled from a Qwen3.5-9B</text><text x="28" y="780" font-size="11.5" fill="#6B7180">teacher, with the composition head; candidates after the context, no prompt. ng1017+1.4V2-Long-L18 =</text><text x="28" y="797" font-size="11.5" fill="#6B7180">1.4V2-Long-L18 with a word n-gram (Youmo IME's pinyin language model with science text mixed in, pruned to 79 MB);</text><text x="28" y="814" font-size="11.5" fill="#6B7180">the composition head's sentences also go through the word choice. ng1017+1.4V2-Long-L12 = a new 12-layer model (word choice</text><text x="28" y="831" font-size="11.5" fill="#6B7180">and composition head distilled from fine-tuned Qwen3.5-9B teachers) with the same n-gram; the default from 1.5.12.</text><text x="28" y="848" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X.</text></svg>
