="12" text-anchor="end" font-weight="400" fill="#1F2330">1.4V2-Sim-L18</text><path d="M614,588 H691.8 Q695.8,588 695.8,592.0 V597.0 Q695.8,601 691.8,601 H614 Z" fill="#B07CE8"><title>1.4V2-Sim-L18: 12.1</title></path><text x="701.8" y="599" font-size="12" font-weight="400" fill="#1F2330">12.1</text><text x="606" y="620" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">ng1017+1.4V2-Long-L18</text><path d="M614,609 H709.4 Q713.4,609 713.4,613.0 V618.0 Q713.4,622 709.4,622 H614 Z" fill="#D6336C"><title>ng1017+1.4V2-Long-L18: 14.7</title></path><text x="719.4" y="620" font-size="12" font-weight="700" fill="#D6336C">14.7</text><line x1="614" y1="500" x2="614" y2="626" stroke="#C9CDD6"/><text x="28" y="656" font-size="11.5" fill="#6B7180">Test set: text from SkyPile, LCCC, Chinese and English C4, SODA and Tatoeba with its preceding text, typed in full pinyin,</text><text x="28" y="673" font-size="11.5" fill="#6B7180">initials, mixed, or the first letters of a word; the candidates are the IME engine's own. Every third row (4175; scored where</text><text x="28" y="690" font-size="11.5" fill="#6B7180">the right word is among two or more candidates). End to end in the IME engine (after the pause), the model on the graphics card</text><text x="28" y="707" font-size="11.5" fill="#6B7180">(DirectML); in English word mode the typed text stays first, so the first word after it. Zhiyi 1.4V2-Long-L18 (1.5.9's default) =</text><text x="28" y="724" font-size="11.5" fill="#6B7180">1.4V2 without 4 sliding-window layers (18), word choice distilled from a Qwen3.5-9B teacher, with the composition head;</text><text x="28" y="741" font-size="11.5" fill="#6B7180">candidates after the context, no prompt. 1.4V2-Sim-L18 = the same with the word-choice head only (for IMEs that compose</text><text x="28" y="758" font-size="11.5" fill="#6B7180">long input their own way); in Zhiyi long input is then composed without the model, hence (b). ng1017+1.4V2-Long-L18 =</text><text x="28" y="775" font-size="11.5" fill="#6B7180">1.4V2-Long-L18 with a word n-gram (Youmo IME's pinyin language model with science text mixed in, pruned to 79 MB);</text><text x="28" y="792" font-size="11.5" fill="#6B7180">the composition head's sentences also go through the word choice.</text><text x="28" y="809" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X.</text></svg>
