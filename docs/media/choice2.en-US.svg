font-weight="700" fill="#1F2330">1.4V2-Long-L18</text><path d="M558,483 H681.2 Q685.2,483 685.2,487.0 V492.0 Q685.2,496 681.2,496 H558 Z" fill="#6A5AE0"><title>1.4V2-Long-L18: 14.6</title></path><text x="691.2" y="494" font-size="12" font-weight="700" fill="#6A5AE0">14.6</text><line x1="558" y1="416" x2="558" y2="500" stroke="#C9CDD6"/><text x="28" y="530" font-size="11.5" fill="#6B7180">Test set: text from SkyPile, LCCC, Chinese and English C4, SODA and Tatoeba with its preceding text, typed in full pinyin,</text><text x="28" y="547" font-size="11.5" fill="#6B7180">initials, mixed, or the first letters of a word; the candidates are the IME engine's own. Every third row (4175; scored where</text><text x="28" y="564" font-size="11.5" fill="#6B7180">the right word is among two or more candidates). End to end in the IME engine (after the pause), the model on the graphics card</text><text x="28" y="581" font-size="11.5" fill="#6B7180">(DirectML); in English word mode the typed text stays first, so the first word after it. Zhiyi 1.4V2-Long-L18 (1.5.9's default) =</text><text x="28" y="598" font-size="11.5" fill="#6B7180">1.4V2 without 4 sliding-window layers (18), word choice distilled from a Qwen3.5-9B teacher, with the composition head;</text><text x="28" y="615" font-size="11.5" fill="#6B7180">candidates after the context, no prompt.</text><text x="28" y="632" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X.</text></svg>
