6.0 V661.0 Q695.8,665 691.8,665 H614 Z" fill="#B07CE8"><title>1.4V2-Sim-L18: 12.1</title></path><text x="701.8" y="663" font-size="12" font-weight="400" fill="#1F2330">12.1</text><text x="606" y="684" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">ng1017+1.4V2-Long-L18</text><path d="M614,673 H709.4 Q713.4,673 713.4,677.0 V682.0 Q713.4,686 709.4,686 H614 Z" fill="#D6336C"><title>ng1017+1.4V2-Long-L18: 14.7</title></path><text x="719.4" y="684" font-size="12" font-weight="700" fill="#D6336C">14.7</text><text x="606" y="705" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+1.4V2-Long-L12</text><path d="M614,694 H680.3 Q684.3,694 684.3,698.0 V703.0 Q684.3,707 680.3,707 H614 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 10.4</title></path><text x="690.3" y="705" font-size="12" font-weight="400" fill="#1F2330">10.4</text><line x1="614" y1="564" x2="614" y2="711" stroke="#C9CDD6"/><text x="28" y="741" font-size="11.5" fill="#6B7180">Test set: text from SkyPile, LCCC, Chinese and English C4, SODA and Tatoeba with its preceding text, typed in full pinyin,</text><text x="28" y="758" font-size="11.5" fill="#6B7180">initials, mixed, or the first letters of a word; the candidates are the IME engine's own. Every third row (4175; scored where</text><text x="28" y="775" font-size="11.5" fill="#6B7180">the right word is among two or more candidates). End to end in the IME engine (after the pause), the model on the graphics card</text><text x="28" y="792" font-size="11.5" fill="#6B7180">(DirectML); in English word mode the typed text stays first, so the first word after it. Zhiyi 1.4V2-Long-L18 (1.5.9's default) =</text><text x="28" y="809" font-size="11.5" fill="#6B7180">1.4V2 without 4 sliding-window layers (18), word choice distilled from a Qwen3.5-9B teacher, with the composition head;</text><text x="28" y="826" font-size="11.5" fill="#6B7180">candidates after the context, no prompt. 1.4V2-Sim-L18 = the same with the word-choice head only (for IMEs that compose</text><text x="28" y="843" font-size="11.5" fill="#6B7180">long input their own way); in Zhiyi long input is then composed without the model, hence (b). ng1017+1.4V2-Long-L18 =</text><text x="28" y="860" font-size="11.5" fill="#6B7180">1.4V2-Long-L18 with a word n-gram (Youmo IME's pinyin language model with science text mixed in, pruned to 79 MB);</text><text x="28" y="877" font-size="11.5" fill="#6B7180">the composition head's sentences also go through the word choice. ng1017+1.4V2-Long-L12 = a new 12-layer model (word choice</text><text x="28" y="894" font-size="11.5" fill="#6B7180">and composition head distilled from fine-tuned Qwen3.5-9B teachers) with the same n-gram; not in the IME yet.</text><text x="28" y="911" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X.</text></svg>
