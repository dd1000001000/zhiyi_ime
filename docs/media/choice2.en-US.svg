t fine-tuned by Zhiyi) ranking the candidates the IME's way.</text><text x="28" y="826" font-size="11.5" fill="#6B7180">Zhiyi 1.4V2-Long-L18 (1.5.9-1.5.11) = 1.4V2 without 4 sliding-window layers (18), word choice distilled from a Qwen3.5-9B</text><text x="28" y="843" font-size="11.5" fill="#6B7180">teacher, with the composition head; candidates after the context, no prompt. ng1017+1.4V2-Long-L18 =</text><text x="28" y="860" font-size="11.5" fill="#6B7180">1.4V2-Long-L18 with a word n-gram (Youmo IME's pinyin language model with science text mixed in, pruned to 79 MB);</text><text x="28" y="877" font-size="11.5" fill="#6B7180">the composition head's sentences also go through the word choice. ng1017+1.4V2-Long-L12 = a new 12-layer model (word choice</text><text x="28" y="894" font-size="11.5" fill="#6B7180">and composition head distilled from fine-tuned Qwen3.5-9B teachers) with the same n-gram; the default from 1.5.12.</text><text x="28" y="911" font-size="11.5" fill="#6B7180">ng1017+1.4V2-ML-Preview = 1.4V2-ML-Preview-1024: Long-L12 trained further with Traditional Chinese, Japanese,</text><text x="28" y="928" font-size="11.5" fill="#6B7180">Korean and Vietnamese (a preview; only Simplified Chinese and English here); not in the IME.</text><text x="28" y="945" font-size="11.5" fill="#6B7180">Speed: ONNX Runtime 1.24.4, int8, the same 274 pages, Ryzen 5 9600X.</text></svg>
