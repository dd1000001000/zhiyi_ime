ong-L12</text><path d="M184,609 H326.8 Q330.8,609 330.8,613.0 V618.0 Q330.8,622 326.8,622 H184 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 75.7</title></path><text x="336.8" y="620" font-size="12" font-weight="700" fill="#2F9E44">75.7</text><line x1="184" y1="500" x2="184" y2="626" stroke="#C9CDD6"/><text x="458" y="474" font-size="14" font-weight="700" fill="#1F2330">(f) CPU 每页耗时</text><text x="458" y="491" font-size="11.5" fill="#6B7180">ms，中位数，4 线程，越低越好</text><text x="606" y="515" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">只按词频</text><text x="618" y="515" font-size="11.5" fill="#6B7180">不用模型</text><text x="606" y="536" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">原始 Laya</text><path d="M614,525 H804.0 Q808.0,525 808.0,529.0 V534.0 Q808.0,538 804.0,538 H614 Z" fill="#E0611A"><title>原始 Laya: 43.3</title></path><text x="814.0" y="536" font-size="12" font-weight="400" fill="#1F2330">43.3</text><text x="606" y="557" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">知意 1.4V2</text><path d="M614,546 H738.6 Q742.6,546 742.6,550.0 V555.0 Q742.6,559 738.6,559 H614 Z" fill="#0E9AA7"><title>知意 1.4V2: 28.7</title></path><text x="748.6" y="557" font-size="12" font-weight="400" fill="#1F2330">28.7</text><text x="606" y="578" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">1.4V2-Long-L18</text><path d="M614,567 H675.4 Q679.4,567 679.4,571.0 V576.0 Q679.4,580 675.4,580 H614 Z" fill="#6A5AE0"><title>1.4V2-Long-L18: 14.6</title></path><text x="685.4" y="578" font-size="12" font-weight="400" fill="#1F2330">14.6</text><text x="606" y="599" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+1.4V2-Long-L18</text><path d="M614,588 H675.9 Q679.9,588 679.9,592.0 V597.0 Q679.9,601 675.9,601 H614 Z" fill="#D6336C"><title>ng1017+1.4V2-Long-L18: 14.7</title></path><text x="685.9" y="599" font-size="12" font-weight="400" fill="#1F2330">14.7</text><text x="606" y="620" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">ng1017+1.4V2-Long-L12</text><path d="M614,609 H656.6 Q660.6,609 660.6,613.0 V618.0 Q660.6,622 656.6,622 H614 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 10.4</title></path><text x="666.6" y="620" font-size="12" font-weight="700" fill="#2F9E44">10.4</text><line x1="614" y1="500" x2="614" y2="626" stroke="#C9CDD6"/><text x="28" y="656" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="673" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="690" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="707" font-size="11.5" fill="#6B7180">原始 Laya = Hugging Face 上的 convaiinnovations/laya（基于 mmBERT-base，未经知意微调），按输入法的方式排候选。</text><text x="28" y="724" font-size="11.5" fill="#6B7180">知意 1.4V2-Long-L18（1.5.9–1.5.11 默认）= 1.4V2 去掉 4 个滑窗层（18 层），用 Qwen3.5-9B 老师模型蒸馏选词，带组句头；候选在上文之后、不带提示词。</text><text x="28" y="741" font-size="11.5" fill="#6B7180">ng1017+1.4V2-Long-L18 = 1.4V2-Long-L18 加词语 n-gram（幽默输入法的拼音语言模型混入科研文本，剪枝到 79 MB），组句头的长句也经选词头排序。</text><text x="28" y="758" font-size="11.5" fill="#6B7180">ng1017+1.4V2-Long-L12 = 12 层的新模型（选词和组句头都由微调过的 Qwen3.5-9B 老师蒸馏）加同一个 n-gram；1.5.12 起的默认。</text><text x="28" y="775" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X。</text></svg>
