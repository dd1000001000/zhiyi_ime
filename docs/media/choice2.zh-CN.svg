" y1="458" x2="558" y2="563" stroke="#C9CDD6"/><text x="28" y="593" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="610" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="627" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="644" font-size="11.5" fill="#6B7180">知意 1.4V2-Long-L18（1.5.9 默认）= 1.4V2 去掉 4 个滑窗层（18 层），用 Qwen3.5-9B 老师模型蒸馏选词，带组句头；候选在上文之后、不带提示词。</text><text x="28" y="661" font-size="11.5" fill="#6B7180">1.4V2-Sim-L18 = 同样的结构只留选词头（给自己组句的输入法用）；在知意里长句不再由模型组句，所以 (b) 较低。</text><text x="28" y="678" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X。</text></svg>
