,673 H655.7 Q659.7,673 659.7,677.0 V682.0 Q659.7,686 655.7,686 H614 Z" fill="#0E9AA7"><title>ng1017+ML-pumpkin-1026: 10.2</title></path><text x="665.7" y="684" font-size="12" font-weight="700" fill="#0E9AA7">10.2</text><text x="606" y="705" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+ML-Flash-1031</text><path d="M614,694 H625.2 Q629.2,694 629.2,698.0 V703.0 Q629.2,707 625.2,707 H614 Z" fill="#F08C00"><title>ng1017+ML-Flash-1031: 3.4</title></path><text x="635.2" y="705" font-size="12" font-weight="400" fill="#1F2330">3.4</text><line x1="614" y1="564" x2="614" y2="711" stroke="#C9CDD6"/><text x="28" y="741" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="758" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="775" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="792" font-size="11.5" fill="#6B7180">原始 Laya = Hugging Face 上的 convaiinnovations/laya（基于 mmBERT-base，未经知意微调），按输入法的方式排候选。</text><text x="28" y="809" font-size="11.5" fill="#6B7180">ng1017 = 词语 n-gram（幽默输入法的拼音语言模型混入科研文本，剪枝到 79 MB），组句头的长句也经选词头排序。</text><text x="28" y="826" font-size="11.5" fill="#6B7180">ng1017+1.4V2-Long-L12 = 12 层的模型（选词和组句头都由微调过的 Qwen3.5-9B 老师蒸馏）加 ng1017；1.5.12–1.5.18 的默认。</text><text x="28" y="843" font-size="11.5" fill="#6B7180">ng1017+ML-pumpkin-1026 = Long-L12 加繁中、日、韩、越文继续训练的多语言版（这里只测简体和英文），1.6.0 起的默认。</text><text x="28" y="860" font-size="11.5" fill="#6B7180">ng1017+ML-Flash-1031 = pumpkin 剪到 8 层、两个头合成一个、加前缀遮罩：上文的 K/V 每段上文只算一次（约 3.4 ms），每次按键只算候选和拼音；</text><text x="28" y="877" font-size="11.5" fill="#6B7180">它的 CPU 耗时是这样一次按键的时间（同一循环里 pumpkin 整图 10.4 ms）；未接入输入法。</text><text x="28" y="894" font-size="11.5" fill="#6B7180">Rime + 雾凇 = librime 1.16.1 加雾凇拼音（2026-10-05），中文用默认方案、英文用它的英文方案 melt_eng，不看上文。</text><text x="28" y="911" font-size="11.5" fill="#6B7180">Rime + 雾凇 + 知意模型 = ML-pumpkin-1026 加 ng1017 带上文给 Rime 的候选重排（中文只排覆盖整个输入的候选）。</text><text x="28" y="928" font-size="11.5" fill="#6B7180">带组句头的各行都用 1.6.0 的引擎重跑：组句头自己组的整句也能排到首位，最后一个音节没打完的长句提高最多；正文里的数字是各版发布时的引擎。</text><text x="28" y="945" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X；新引擎多出的一次组句在后台算，不计入每页耗时。</text></svg>
