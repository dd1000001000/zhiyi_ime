0.6,673 660.6,677.0 V682.0 Q660.6,686 656.6,686 H614 Z" fill="#2F9E44"><title>ng1017+1.4V2-Long-L12: 10.4</title></path><text x="666.6" y="684" font-size="12" font-weight="700" fill="#2F9E44">10.4</text><text x="606" y="705" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">ng1017+1.4V2-ML-Preview</text><path d="M614,694 H656.1 Q660.1,694 660.1,698.0 V703.0 Q660.1,707 656.1,707 H614 Z" fill="#E8A33D"><title>ng1017+1.4V2-ML-Preview: 10.3</title></path><text x="666.1" y="705" font-size="12" font-weight="400" fill="#1F2330">10.3</text><line x1="614" y1="564" x2="614" y2="711" stroke="#C9CDD6"/><text x="28" y="741" font-size="11.5" fill="#6B7180">测试集：SkyPile、LCCC、C4 中文与 C4 英文、SODA、Tatoeba 的文本，带光标前的上文，按全拼、简拼、混打、只打前几个字母等方式输入，</text><text x="28" y="758" font-size="11.5" fill="#6B7180">候选为输入法引擎的实际候选；图中为其中每三条取一条（4175 条，计分的是正确词在候选里且候选至少两个的）。</text><text x="28" y="775" font-size="11.5" fill="#6B7180">在输入法引擎里端到端（停顿后），模型在显卡上（DirectML）；英文模式第一个是打的字母本身，这里看它后面的第一个词。</text><text x="28" y="792" font-size="11.5" fill="#6B7180">原始 Laya = Hugging Face 上的 convaiinnovations/laya（基于 mmBERT-base，未经知意微调），按输入法的方式排候选。</text><text x="28" y="809" font-size="11.5" fill="#6B7180">知意 1.4V2-Long-L18（1.5.9–1.5.11 默认）= 1.4V2 去掉 4 个滑窗层（18 层），用 Qwen3.5-9B 老师模型蒸馏选词，带组句头；候选在上文之后、不带提示词。</text><text x="28" y="826" font-size="11.5" fill="#6B7180">ng1017+1.4V2-Long-L18 = 1.4V2-Long-L18 加词语 n-gram（幽默输入法的拼音语言模型混入科研文本，剪枝到 79 MB），组句头的长句也经选词头排序。</text><text x="28" y="843" font-size="11.5" fill="#6B7180">ng1017+1.4V2-Long-L12 = 12 层的新模型（选词和组句头都由微调过的 Qwen3.5-9B 老师蒸馏）加同一个 n-gram；1.5.12 起的默认。</text><text x="28" y="860" font-size="11.5" fill="#6B7180">ng1017+1.4V2-ML-Preview = 1.4V2-ML-Preview-1024：Long-L12 加繁中、日、韩、越文训练的预览版，未接入输入法。</text><text x="28" y="877" font-size="11.5" fill="#6B7180">速度：ONNX Runtime 1.24.4，int8，同样 274 页，Ryzen 5 9600X。</text></svg>
