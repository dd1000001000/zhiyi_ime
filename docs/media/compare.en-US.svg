,508.9 V524 Z" fill="#1BAF7A"><title>metaseq-25M: 25.5 MB</title></path><text x="716.2" y="498.9" font-size="12" text-anchor="middle" font-weight="400" fill="#1F2330">25.5</text><path d="M783.8,524 V382.5 Q783.8,378.5 787.8,378.5 H825.8 Q829.8,378.5 829.8,382.5 V524 Z" fill="#6A5AE0"><title>Zhiyi IME (Laya): 194 MB</title></path><text x="806.8" y="372.5" font-size="12" text-anchor="middle" font-weight="700" fill="#6A5AE0">194</text><line x1="490" y1="524" x2="852" y2="524" stroke="#C9CDD6"/><text x="28" y="556" font-size="12" fill="#6B7180">metaseq = metasequoiaime/pinyin-ime-reranker (Apache-2.0, Chinese only): a character-level LM scoring</text><text x="28" y="574" font-size="12" fill="#6B7180">each candidate on its own. Alone it reaches 42.0% / 48.2% in (a) and 71.1% / 79.4% in (b); shown with the</text><text x="28" y="592" font-size="12" fill="#6B7180">engine rank prior added (weight chosen on a dev set). Zhiyi: the deployed int8 model, no rank prior for</text><text x="28" y="610" font-size="12" fill="#6B7180">Chinese. In (a) ~13% of the right words are not among the candidates; every method counts them as wrong.</text></svg>
