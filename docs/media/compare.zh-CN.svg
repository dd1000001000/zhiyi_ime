size="12" font-weight="400" fill="#1F2330">31</text><text x="528" y="764" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Laya 原始</text><path d="M536,753 H804.0 Q808.0,753 808.0,757.0 V762.0 Q808.0,766 804.0,766 H536 Z" fill="#2A78D6"><title>Laya 原始: 335</title></path><text x="814.0" y="764" font-size="12" font-weight="400" fill="#1F2330">335</text><text x="528" y="785" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">知意 1.1</text><path d="M536,774 H697.2 Q701.2,774 701.2,778.0 V783.0 Q701.2,787 697.2,787 H536 Z" fill="#1BAF7A"><title>知意 1.1: 204</title></path><text x="707.2" y="785" font-size="12" font-weight="400" fill="#1F2330">204</text><text x="528" y="806" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">知意 1.2</text><path d="M536,795 H600.8 Q604.8,795 604.8,799.0 V804.0 Q604.8,808 600.8,808 H536 Z" fill="#6A5AE0"><title>知意 1.2: 85</title></path><text x="610.8" y="806" font-size="12" font-weight="700" fill="#6A5AE0">85</text><line x1="536" y1="686" x2="536" y2="812" stroke="#C9CDD6"/><text x="28" y="842" font-size="11.5" fill="#6B7180">水杉 = metasequoiaime/pinyin-ime-reranker（只支持中文）；准确率为加上引擎排位先验的结果，单独使用为 42.0 / 48.2%（a）、71.1 / 79.4%（b）。</text><text x="28" y="859" font-size="11.5" fill="#6B7180">Laya 原始 = 未微调的 convaiinnovations/laya 多语言模型，提示词相同。知意 1.1 = 微调的 mmBERT-base；知意 1.2 = 由它蒸馏的 mmBERT-small。</text><text x="28" y="876" font-size="11.5" fill="#6B7180">准确率为 CPU int8 推理，正确词不在候选里的都算错。速度与占用：ONNX Runtime 1.24.4，int8，同样 400 页候选（上文最多 128 字），</text><text x="28" y="893" font-size="11.5" fill="#6B7180">AMD Ryzen 5 9600X / RTX 5070 Ti。输入法里知意的权重从本机缓存映射，实际私有内存比 (f) 少。</text></svg>
