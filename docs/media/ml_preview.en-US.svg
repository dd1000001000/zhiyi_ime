fill="#1F2330">Traditional + zh-Hant.ngram</text><path d="M218,222 H733.9 Q737.9,222 737.9,226.0 V232.0 Q737.9,236 733.9,236 H218 Z" fill="#2F9E44"><title>Traditional + zh-Hant.ngram Short: words and phrases (word choice): 89.0</title></path><text x="743.9" y="234" font-size="12" fill="#1F2330">89.0</text><path d="M218,242 H495.1 Q499.1,242 499.1,246.0 V252.0 Q499.1,256 495.1,256 H218 Z" fill="#E8A33D"><title>Traditional + zh-Hant.ngram Long: whole sentences: 48.1</title></path><text x="505.1" y="254" font-size="12" fill="#1F2330">48.1</text><text x="208" y="298" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">Japanese + ja.ngram</text><path d="M218,276 H742.9 Q746.9,276 746.9,280.0 V286.0 Q746.9,290 742.9,290 H218 Z" fill="#2F9E44"><title>Japanese + ja.ngram Short: words and phrases (word choice): 90.6</title></path><text x="752.9" y="288" font-size="12" fill="#1F2330">90.6</text><path d="M218,296 H601.2 Q605.2,296 605.2,300.0 V306.0 Q605.2,310 601.2,310 H218 Z" fill="#E8A33D"><title>Japanese + ja.ngram Long: whole sentences: 66.3</title></path><text x="611.2" y="308" font-size="12" fill="#1F2330">66.3</text><text x="208" y="352" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">Korean</text><path d="M218,330 H544.5 Q548.5,330 548.5,334.0 V340.0 Q548.5,344 544.5,344 H218 Z" fill="#2F9E44"><title>Korean Short: words and phrases (word choice): 56.6</title></path><text x="554.5" y="342" font-size="12" fill="#1F2330">56.6</text><text x="224" y="362" font-size="11.5" fill="#6B7180">no sentence test</text><text x="208" y="406" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">Vietnamese</text><path d="M218,384 H684.7 Q688.7,384 688.7,388.0 V394.0 Q688.7,398 684.7,398 H218 Z" fill="#2F9E44"><title>Vietnamese Short: words and phrases (word choice): 80.6</title></path><text x="694.7" y="396" font-size="12" fill="#1F2330">80.6</text><text x="224" y="416" font-size="11.5" fill="#6B7180">no sentence test</text><line x1="218" y1="110" x2="218" y2="424" stroke="#C9CDD6"/><text x="28" y="452" font-size="11.5" fill="#6B7180">Short: the right word is the first candidate, the language's input methods weighted equally. Long: the whole sentence right.</text><text x="28" y="469" font-size="11.5" fill="#6B7180">Simplified Chinese, English: end to end in Zhiyi IME's engine (every third row of the new word-choice test set; long = long</text><text x="28" y="486" font-size="11.5" fill="#6B7180">input), with ng1017. Traditional Chinese (pinyin, two Zhuyin engines, Jyutping, Cangjie 5/3, Quick 5/3), Japanese (Mozc</text><text x="28" y="503" font-size="11.5" fill="#6B7180">conversion, prediction, whole sentence), Korean (completion), Vietnamese (no diacritics, first letters): the int8 model ranking</text><text x="28" y="520" font-size="11.5" fill="#6B7180">other IME engines' candidates, 3000 rows per test file; Traditional and Japanese with ngram-ml-1024's n-grams (even rows).</text><text x="28" y="537" font-size="11.5" fill="#6B7180">Long for Traditional and Japanese: the composition head writes the whole sentence from the typed pinyin / Zhuyin / Jyutping /</text><text x="28" y="554" font-size="11.5" fill="#6B7180">kana (no candidates, no n-gram), 3000 rows each.</text></svg>
