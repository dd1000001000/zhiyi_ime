<svg xmlns="http://www.w3.org/2000/svg" width="880" height="545" viewBox="0 0 880 545" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif"><rect width="880" height="545" rx="14" fill="#FFFFFF"/><rect x="0.5" y="0.5" width="879" height="544" rx="14" fill="none" stroke="#E3E5EB"/><text x="28" y="40" font-size="20" font-weight="700" fill="#1F2330">知意 1.4V2-ML-Preview-1024：各语言的短句和长句</text><text x="28" y="62" font-size="12" fill="#6B7180">首选 / 整句正确 %，越高越好；有 n-gram 的语言加上 n-gram</text><rect x="28" y="77" width="14" height="14" rx="3" fill="#2F9E44"/><text x="48" y="88" font-size="13" fill="#6B7180">短：词和词组（选词）</text><rect x="206" y="77" width="14" height="14" rx="3" fill="#E8A33D"/><text x="226" y="88" font-size="13" fill="#6B7180">长：整句</text><text x="208" y="136" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">简体中文 + ng1017</text><path d="M218,114 H726.8 Q730.8,114 730.8,118.0 V124.0 Q730.8,128 726.8,128 H218 Z" fill="#2F9E44"><title>简体中文 + ng1017 短：词和词组（选词）: 87.8</title></path><text x="736.8" y="126" font-size="12" fill="#1F2330">87.8</text><path d="M218,134 H640.6 Q644.6,134 644.6,138.0 V144.0 Q644.6,148 640.6,148 H218 Z" fill="#E8A33D"><title>简体中文 + ng1017 长：整句: 73.1</title></path><text x="650.6" y="146" font-size="12" fill="#1F2330">73.1</text><text x="208" y="190" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">英文</text><path d="M218,168 H738.3 Q742.3,168 742.3,172.0 V178.0 Q742.3,182 738.3,182 H218 Z" fill="#2F9E44"><title>英文 短：词和词组（选词）: 89.8</title></path><text x="748.3" y="180" font-size="12" fill="#1F2330">89.8</text><text x="224" y="200" font-size="11.5" fill="#6B7180">无长句测试</text><text x="208" y="244" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">繁体中文 + zh-Hant.ngram</text><path d="M218,222 H733.9 Q737.9,222 737.9,226.0 V232.0 Q737.9,236 733.9,236 H218 Z" fill="#2F9E44"><title>繁体中文 + zh-Hant.ngram 短：词和词组（选词）: 89.0</title></path><text x="743.9" y="234" font-size="12" fill="#1F2330">89.0</text><path d="M218,242 H495.1 Q499.1,242 499.1,246.0 V252.0 Q499.1,256 495.1,256 H218 Z" fill="#E8A33D"><title>繁体中文 + zh-Hant.ngram 长：整句: 48.1</title></path><text x="505.1" y="254" font-size="12" fill="#1F2330">48.1</text><text x="208" y="298" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">日文 + ja.ngram</text><path d="M218,276 H742.9 Q746.9,276 746.9,280.0 V286.0 Q746.9,290 742.9,290 H218 Z" fill="#2F9E44"><title>日文 + ja.ngram 短：词和词组（选词）: 90.6</title></path><text x="752.9" y="288" font-size="12" fill="#1F2330">90.6</text><path d="M218,296 H601.2 Q605.2,296 605.2,300.0 V306.0 Q605.2,310 601.2,310 H218 Z" fill="#E8A33D"><title>日文 + ja.ngram 长：整句: 66.3</title></path><text x="611.2" y="308" font-size="12" fill="#1F2330">66.3</text><text x="208" y="352" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">韩文</text><path d="M218,330 H544.5 Q548.5,330 548.5,334.0 V340.0 Q548.5,344 544.5,344 H218 Z" fill="#2F9E44"><title>韩文 短：词和词组（选词）: 56.6</title></path><text x="554.5" y="342" font-size="12" fill="#1F2330">56.6</text><text x="224" y="362" font-size="11.5" fill="#6B7180">无长句测试</text><text x="208" y="406" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">越南文</text><path d="M218,384 H684.7 Q688.7,384 688.7,388.0 V394.0 Q688.7,398 684.7,398 H218 Z" fill="#2F9E44"><title>越南文 短：词和词组（选词）: 80.6</title></path><text x="694.7" y="396" font-size="12" fill="#1F2330">80.6</text><text x="224" y="416" font-size="11.5" fill="#6B7180">无长句测试</text><line x1="218" y1="110" x2="218" y2="424" stroke="#C9CDD6"/><text x="28" y="452" font-size="11.5" fill="#6B7180">短：候选里第一个就是对的词的比例，同一语言的各种输入方式等权平均。长：整句完全正确的比例。</text><text x="28" y="469" font-size="11.5" fill="#6B7180">简体中文、英文：在知意输入法引擎里端到端（新选词测试集每三条取一条，长 = 长句输入），加 ng1017。</text><text x="28" y="486" font-size="11.5" fill="#6B7180">繁体中文（拼音、注音两种、粤拼、仓颉五代/三代、速成五代/三代）、日文（Mozc 转换、预测、整句）、韩文（补全）、越南文（不带声调、</text><text x="28" y="503" font-size="11.5" fill="#6B7180">只打首字母）：int8 模型对其他输入法引擎的候选排序，每个测试文件 3000 条；繁体和日文加 ngram-ml-1024 的 n-gram（偶数行）。</text><text x="28" y="520" font-size="11.5" fill="#6B7180">繁体和日文的长句：组句头直接按所打的拼音 / 注音 / 粤拼 / 假名写出整句（不经候选、不加 n-gram），每种 3000 条。</text></svg>
