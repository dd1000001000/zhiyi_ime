,524 H218 Z" fill="#2F9E44"><title>Korean Short: words and phrases (word choice) · ML-pumpkin-1026: 60.5</title></path><text x="577.3" y="522" font-size="12" fill="#1F2330">60.5</text><text x="224" y="542" font-size="11.5" fill="#6B7180">no sentence test</text><text x="208" y="608.0" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">Vietnamese</text><path d="M218,564 H684.7 Q688.7,564 688.7,568.0 V574.0 Q688.7,578 684.7,578 H218 Z" fill="#A9D8B4"><title>Vietnamese Short: words and phrases (word choice) · 1.4V2-ML-Preview-1024: 80.6</title></path><text x="694.7" y="576" font-size="12" fill="#1F2330">80.6</text><path d="M218,584 H688.5 Q692.5,584 692.5,588.0 V594.0 Q692.5,598 688.5,598 H218 Z" fill="#2F9E44"><title>Vietnamese Short: words and phrases (word choice) · ML-pumpkin-1026: 81.2</title></path><text x="698.5" y="596" font-size="12" fill="#1F2330">81.2</text><text x="224" y="616" font-size="11.5" fill="#6B7180">no sentence test</text><line x1="218" y1="130" x2="218" y2="624" stroke="#C9CDD6"/><text x="28" y="652" font-size="11.5" fill="#6B7180">Short: the right word is the first candidate, the language's input methods weighted equally. Long: the whole sentence right.</text><text x="28" y="669" font-size="11.5" fill="#6B7180">Simplified Chinese, English: end to end in Zhiyi IME's engine (every third row of the new word-choice test set; long = long</text><text x="28" y="686" font-size="11.5" fill="#6B7180">input), with ng1017. Traditional Chinese (pinyin, two Zhuyin engines, Jyutping, Cangjie 5/3, Quick 5/3), Japanese (Mozc</text><text x="28" y="703" font-size="11.5" fill="#6B7180">conversion, prediction, whole sentence), Korean (completion), Vietnamese (no diacritics, first letters): the int8 model ranking</text><text x="28" y="720" font-size="11.5" fill="#6B7180">other IME engines' candidates, 3000 rows per test file; Traditional and Japanese with ngram-ml-1024's n-grams (even rows).</text><text x="28" y="737" font-size="11.5" fill="#6B7180">Long for Traditional and Japanese: the composition head writes the whole sentence from the typed pinyin / Zhuyin / Jyutping /</text><text x="28" y="754" font-size="11.5" fill="#6B7180">kana (no candidates, no n-gram), 3000 rows each.</text></svg>
