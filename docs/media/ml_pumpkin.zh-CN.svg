南文 短：词和词组（选词） · ML-pumpkin-1026: 81.2</title></path><text x="698.5" y="596" font-size="12" fill="#1F2330">81.2</text><text x="224" y="616" font-size="11.5" fill="#6B7180">无长句测试</text><line x1="218" y1="130" x2="218" y2="624" stroke="#C9CDD6"/><text x="28" y="652" font-size="11.5" fill="#6B7180">短：候选里第一个就是对的词的比例，同一语言的各种输入方式等权平均。长：整句完全正确的比例。</text><text x="28" y="669" font-size="11.5" fill="#6B7180">简体中文、英文：在知意输入法引擎里端到端（新选词测试集每三条取一条，长 = 长句输入），加 ng1017。</text><text x="28" y="686" font-size="11.5" fill="#6B7180">繁体中文（拼音、注音两种、粤拼、仓颉五代/三代、速成五代/三代）、日文（Mozc 转换、预测、整句）、韩文（补全）、越南文（不带声调、</text><text x="28" y="703" font-size="11.5" fill="#6B7180">只打首字母）：int8 模型对其他输入法引擎的候选排序，每个测试文件 3000 条；繁体和日文加 ngram-ml-1024 的 n-gram（偶数行）。</text><text x="28" y="720" font-size="11.5" fill="#6B7180">繁体和日文的长句：组句头直接按所打的拼音 / 注音 / 粤拼 / 假名写出整句（不经候选、不加 n-gram），每种 3000 条。</text></svg>
