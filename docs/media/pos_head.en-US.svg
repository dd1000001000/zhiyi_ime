d: 72.8</title></path><text x="657.9" y="728" font-size="11" font-weight="700" fill="#1F2330">72.8</text><path d="M238,733 H761.7 Q764.7,733 764.7,736.0 V741.0 Q764.7,744 761.7,744 H238 Z" fill="#4C6EF5"><title>Hand-written: Chinese (158) GLM-5.3: 92.4</title></path><text x="769.7" y="743" font-size="11" fill="#1F2330">92.4</text><text x="228" y="791" font-size="13" font-weight="700" text-anchor="end" fill="#1F2330">Hand-written: English (97)</text><path d="M238,760 H481.8 Q484.8,760 484.8,763.0 V768.0 Q484.8,771 481.8,771 H238 Z" fill="#ADB5BD"><title>Hand-written: English (97) Most frequent tag (no context): 43.3</title></path><text x="489.8" y="770" font-size="11" fill="#1F2330">43.3</text><path d="M238,775 H493.6 Q496.6,775 496.6,778.0 V783.0 Q496.6,786 493.6,786 H238 Z" fill="#F2A7C3"><title>Hand-written: English (97) Head, no context: 45.4</title></path><text x="501.6" y="785" font-size="11" fill="#1F2330">45.4</text><path d="M238,790 H740.4 Q743.4,790 743.4,793.0 V798.0 Q743.4,801 740.4,801 H238 Z" fill="#D6336C"><title>Hand-written: English (97) Zhiyi v4-1024 POS head: 88.7</title></path><text x="748.4" y="800" font-size="11" font-weight="700" fill="#1F2330">88.7</text><path d="M238,805 H775.6 Q778.6,805 778.6,808.0 V813.0 Q778.6,816 775.6,816 H238 Z" fill="#4C6EF5"><title>Hand-written: English (97) GLM-5.3: 94.8</title></path><text x="783.6" y="815" font-size="11" fill="#1F2330">94.8</text><line x1="238" y1="108" x2="238" y2="820" stroke="#C9CDD6"/><text x="28" y="846" font-size="11.5" fill="#6B7180">UD ambiguous words: words of the UD 2.18 test sets (human labels, never trained on) seen 5+ times in UD's train sets with</text><text x="28" y="863" font-size="11.5" fill="#6B7180">their most frequent tag at most 75% of them, all 2726, scored by UD's tags. Hand-written pairs: the same candidate after</text><text x="28" y="880" font-size="11.5" fill="#6B7180">different preceding text (light after "Please turn on the" is a noun, after "The bag is very" an adjective), Chinese 79</text><text x="28" y="897" font-size="11.5" fill="#6B7180">words / 158 items, English 47 / 97, the right answers labelled by Claude Opus 5.5 following UD's rules. Most frequent</text><text x="28" y="914" font-size="11.5" fill="#6B7180">tag: the word's most frequent tag in the training data.</text><text x="28" y="931" font-size="11.5" fill="#6B7180">Head: a 2 MB network on five hidden states of the translator, the last 80 characters before the candidate; no second model.</text><text x="28" y="948" font-size="11.5" fill="#6B7180">GLM-5.3 (thinking off, the same preceding text) only on the hand-written pairs: UD has its own conventions (Chinese 的 SCONJ,</text><text x="28" y="965" font-size="11.5" fill="#6B7180">会 and Korean 있다 AUX) that the head and the frequency baseline learnt from UD's train sets and GLM never saw; scored by</text><text x="28" y="982" font-size="11.5" fill="#6B7180">UD's tags it gets 56.7% of the UD part, which says little about its judgement. The head's weak spot: Chinese verb/noun</text><text x="28" y="999" font-size="11.5" fill="#6B7180">and adjective/noun words, taken as nouns.</text></svg>
