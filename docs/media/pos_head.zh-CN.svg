性头，不给上文: 45.4</title></path><text x="501.6" y="785" font-size="11" fill="#1F2330">45.4</text><path d="M238,790 H740.4 Q743.4,790 743.4,793.0 V798.0 Q743.4,801 740.4,801 H238 Z" fill="#D6336C"><title>手写对照：英文 (97) 知意 v4-1024 词性头: 88.7</title></path><text x="748.4" y="800" font-size="11" font-weight="700" fill="#1F2330">88.7</text><path d="M238,805 H775.6 Q778.6,805 778.6,808.0 V813.0 Q778.6,816 775.6,816 H238 Z" fill="#4C6EF5"><title>手写对照：英文 (97) GLM-5.3: 94.8</title></path><text x="783.6" y="815" font-size="11" fill="#1F2330">94.8</text><line x1="238" y1="108" x2="238" y2="820" stroke="#C9CDD6"/><text x="28" y="846" font-size="11.5" fill="#6B7180">UD 兼类词：UD 2.18 测试集（人工标注，训练时没见过）里，在 UD 训练集中出现 5 次以上、最常见的词性占比不超过 75% 的词，</text><text x="28" y="863" font-size="11.5" fill="#6B7180">共 2726 个，按 UD 的标注计分。手写对照：同一个候选放在不同的上文后面（如“科学家们正在|研究”是动词、“这是一项重要的|研究”</text><text x="28" y="880" font-size="11.5" fill="#6B7180">是名词），中文 79 个词 158 条、英文 47 个词 97 条，标准答案由 Claude Opus 5.5 按 UD 的规则标注。</text><text x="28" y="897" font-size="11.5" fill="#6B7180">只按词频：这个词在训练数据里最常见的词性。</text><text x="28" y="914" font-size="11.5" fill="#6B7180">词性头：读翻译模型 5 层隐藏状态的 2 MB 小网络，上文取候选前的 80 个字，不需要第二个模型。GLM-5.3：关闭思考，同样只看前文。</text><text x="28" y="931" font-size="11.5" fill="#6B7180">GLM-5.3 只比手写对照：UD 有自己的标注约定（如中文“的”标为 SCONJ、“会”和韩文“있다”标为 AUX），词性头和词频在 UD 训练集上学过，</text><text x="28" y="948" font-size="11.5" fill="#6B7180">GLM 没学过，按 UD 计分它在 UD 兼类词上只有 56.7%，反映不了它的判断。词性头的弱项是中文动名、形名兼类词，多判成名词（如“认真地|工作”）。</text></svg>
