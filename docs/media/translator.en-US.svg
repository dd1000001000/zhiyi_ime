 H115.2 Q118.4,627 118.4,630.2 V636.8 Q118.4,640 115.2,640 H112 Z" fill="#6A5AE0"><title>Zhiyi v3: 279</title></path><text x="124.4" y="638" font-size="12" font-weight="700" fill="#6A5AE0">279</text><line x1="112" y1="560" x2="112" y2="644" stroke="#C9CDD6"/><text x="311" y="534" font-size="14" font-weight="700" fill="#1F2330">(k) Memory</text><text x="311" y="551" font-size="11.5" fill="#6B7180">MB working set on the CPU, lower is better</text><text x="387" y="575" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 7B</text><path d="M395,564 H518.0 Q522.0,564 522.0,568.0 V573.0 Q522.0,577 518.0,577 H395 Z" fill="#EDA100"><title>Hy-MT2 7B: 8,873</title></path><text x="528.0" y="575" font-size="12" font-weight="400" fill="#1F2330">8,873</text><text x="387" y="596" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">LMT-60</text><path d="M395,585 H410.7 Q414.7,585 414.7,589.0 V594.0 Q414.7,598 410.7,598 H395 Z" fill="#2A78D6"><title>LMT-60: 1,379</title></path><text x="420.7" y="596" font-size="12" font-weight="400" fill="#1F2330">1,379</text><text x="387" y="617" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Zhiyi v2</text><path d="M395,606 H410.5 Q414.5,606 414.5,610.0 V615.0 Q414.5,619 410.5,619 H395 Z" fill="#B3ABEE"><title>Zhiyi v2: 1,359</title></path><text x="420.5" y="617" font-size="12" font-weight="400" fill="#1F2330">1,359</text><text x="387" y="638" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">Zhiyi v3</text><path d="M395,627 H406.0 Q410.0,627 410.0,631.0 V636.0 Q410.0,640 406.0,640 H395 Z" fill="#6A5AE0"><title>Zhiyi v3: 1,050</title></path><text x="416.0" y="638" font-size="12" font-weight="700" fill="#6A5AE0">1,050</text><line x1="395" y1="560" x2="395" y2="644" stroke="#C9CDD6"/><text x="28" y="674" font-size="11.5" fill="#6B7180">Zhiyi v3 = NiuTrans LMT-60-0.6B with 8 of its 28 layers removed, distilled from Hy-MT2-7B's translations of about</text><text x="28" y="691" font-size="11.5" fill="#6B7180">2.75 million candidates and sentences in 9 languages (zh en ja ko fr de es ru vi); Zhiyi v2 = the model used from IME 1.3.0</text><text x="28" y="708" font-size="11.5" fill="#6B7180">(28 layers, trained on Chinese and English sources only); LMT-60 is the original base of both; 7B is the teacher (not</text><text x="28" y="725" font-size="11.5" fill="#6B7180">released). COMET-22: Unbabel/wmt22-comet-da x100, averaged over directions, (a)-(c) start at 50; FLORES-200 devtest and</text><text x="28" y="742" font-size="11.5" fill="#6B7180">NTREX-128 cover every pair of the 9 languages. Off-target: by script (e.g. Chinese where Korean was asked for).</text><text x="28" y="759" font-size="11.5" fill="#6B7180">Speed and footprint: llama.cpp b11480 (Vulkan), 10 parallel slots and no prompt cache as in the IME, 1,730 real</text><text x="28" y="776" font-size="11.5" fill="#6B7180">candidates the language packs lack, 7 a page in parallel, Ryzen 5 9600X / RTX 5070 Ti; the 7B CPU time is over 346.</text></svg>
