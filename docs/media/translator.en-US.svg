 H115.2 Q118.4,627 118.4,630.2 V636.8 Q118.4,640 115.2,640 H112 Z" fill="#12A37F"><title>Zhiyi v4: 276</title></path><text x="124.4" y="638" font-size="12" font-weight="700" fill="#12A37F">276</text><line x1="112" y1="560" x2="112" y2="644" stroke="#C9CDD6"/><text x="311" y="534" font-size="14" font-weight="700" fill="#1F2330">(k) Memory</text><text x="311" y="551" font-size="11.5" fill="#6B7180">MB working set on the CPU, lower is better</text><text x="387" y="575" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 7B</text><path d="M395,564 H518.0 Q522.0,564 522.0,568.0 V573.0 Q522.0,577 518.0,577 H395 Z" fill="#EDA100"><title>Hy-MT2 7B: 8,873</title></path><text x="528.0" y="575" font-size="12" font-weight="400" fill="#1F2330">8,873</text><text x="387" y="596" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">LMT-60</text><path d="M395,585 H410.7 Q414.7,585 414.7,589.0 V594.0 Q414.7,598 410.7,598 H395 Z" fill="#2A78D6"><title>LMT-60: 1,379</title></path><text x="420.7" y="596" font-size="12" font-weight="400" fill="#1F2330">1,379</text><text x="387" y="617" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Zhiyi v3</text><path d="M395,606 H406.0 Q410.0,606 410.0,610.0 V615.0 Q410.0,619 406.0,619 H395 Z" fill="#6A5AE0"><title>Zhiyi v3: 1,050</title></path><text x="416.0" y="617" font-size="12" font-weight="400" fill="#1F2330">1,050</text><text x="387" y="638" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">Zhiyi v4</text><path d="M395,627 H406.1 Q410.1,627 410.1,631.0 V636.0 Q410.1,640 406.1,640 H395 Z" fill="#12A37F"><title>Zhiyi v4: 1,055</title></path><text x="416.1" y="638" font-size="12" font-weight="700" fill="#12A37F">1,055</text><line x1="395" y1="560" x2="395" y2="644" stroke="#C9CDD6"/><text x="28" y="674" font-size="11.5" fill="#6B7180">Zhiyi v4 = v3's structure trained on about 3.6 million pairs: 0.88 million new ones aimed at v3's weak spots, Hy-MT2-30B-A3B</text><text x="28" y="691" font-size="11.5" fill="#6B7180">for items whose meaning the context decides and for about 1,100 ambiguous words, and a 28-layer teacher's output</text><text x="28" y="708" font-size="11.5" fill="#6B7180">probabilities (the teacher is not released); released in release translator, the IME still runs v3 for now.</text><text x="28" y="725" font-size="11.5" fill="#6B7180">Zhiyi v3 = NiuTrans LMT-60-0.6B with 8 of its 28 layers removed, distilled from Hy-MT2-7B's translations of about</text><text x="28" y="742" font-size="11.5" fill="#6B7180">2.75 million candidates and sentences in 9 languages (zh en ja ko fr de es ru vi); LMT-60 is the original base of all;</text><text x="28" y="759" font-size="11.5" fill="#6B7180">7B is v3's teacher (not released). COMET-22: Unbabel/wmt22-comet-da x100, averaged over directions, (a)-(c) start at 50;</text><text x="28" y="776" font-size="11.5" fill="#6B7180">FLORES-200 devtest and NTREX-128 cover every pair of the 9 languages.</text><text x="28" y="793" font-size="11.5" fill="#6B7180">Off-target: by script (e.g. Chinese where Korean was asked for).</text><text x="28" y="810" font-size="11.5" fill="#6B7180">Speed and footprint: llama.cpp b11480 (Vulkan), 10 parallel slots and no prompt cache as in the IME, 1,730 real</text><text x="28" y="827" font-size="11.5" fill="#6B7180">candidates the language packs lack, 7 a page in parallel, Ryzen 5 9600X / RTX 5070 Ti; the 7B CPU time is over 346.</text></svg>
