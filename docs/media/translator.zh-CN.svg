><text x="28" y="365" font-size="11.5" fill="#6B7180">MB，显卡上运行，越低越好</text><text x="104" y="389" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 7B</text><path d="M112,378 H235.0 Q239.0,378 239.0,382.0 V387.0 Q239.0,391 235.0,391 H112 Z" fill="#EDA100"><title>Hy-MT2 7B: 5,315</title></path><text x="245.0" y="389" font-size="12" font-weight="400" fill="#1F2330">5,315</text><text x="104" y="410" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 1.8B</text><path d="M112,399 H142.2 Q146.2,399 146.2,403.0 V408.0 Q146.2,412 142.2,412 H112 Z" fill="#2A78D6"><title>Hy-MT2 1.8B: 1,433</title></path><text x="152.2" y="410" font-size="12" font-weight="400" fill="#1F2330">1,433</text><text x="104" y="431" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">知意 v2</text><path d="M112,420 H129.3 Q133.3,420 133.3,424.0 V429.0 Q133.3,433 129.3,433 H112 Z" fill="#6A5AE0"><title>知意 v2: 892</title></path><text x="139.3" y="431" font-size="12" font-weight="700" fill="#6A5AE0">892</text><line x1="112" y1="374" x2="112" y2="437" stroke="#C9CDD6"/><text x="311" y="348" font-size="14" font-weight="700" fill="#1F2330">(h) 内存</text><text x="311" y="365" font-size="11.5" fill="#6B7180">MB，CPU 上运行的工作集，越低越好</text><text x="387" y="389" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 7B</text><path d="M395,378 H518.0 Q522.0,378 522.0,382.0 V387.0 Q522.0,391 518.0,391 H395 Z" fill="#EDA100"><title>Hy-MT2 7B: 8,741</title></path><text x="528.0" y="389" font-size="12" font-weight="400" fill="#1F2330">8,741</text><text x="387" y="410" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 1.8B</text><path d="M395,399 H424.6 Q428.6,399 428.6,403.0 V408.0 Q428.6,412 424.6,412 H395 Z" fill="#2A78D6"><title>Hy-MT2 1.8B: 2,310</title></path><text x="434.6" y="410" font-size="12" font-weight="400" fill="#1F2330">2,310</text><text x="387" y="431" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">知意 v2</text><path d="M395,420 H409.1 Q413.1,420 413.1,424.0 V429.0 Q413.1,433 409.1,433 H395 Z" fill="#6A5AE0"><title>知意 v2: 1,244</title></path><text x="419.1" y="431" font-size="12" font-weight="700" fill="#6A5AE0">1,244</text><line x1="395" y1="374" x2="395" y2="437" stroke="#C9CDD6"/><text x="594" y="348" font-size="14" font-weight="700" fill="#1F2330">(i) 下载大小</text><text x="594" y="365" font-size="11.5" fill="#6B7180">MB，Q4_K_M，越小越好</text><text x="670" y="389" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 7B</text><path d="M678,378 H801.0 Q805.0,378 805.0,382.0 V387.0 Q805.0,391 801.0,391 H678 Z" fill="#EDA100"><title>Hy-MT2 7B: 4,625</title></path><text x="811.0" y="389" font-size="12" font-weight="400" fill="#1F2330">4,625</text><text x="670" y="410" font-size="12" text-anchor="end" font-weight="400" fill="#1F2330">Hy-MT2 1.8B</text><path d="M678,399 H705.1 Q709.1,399 709.1,403.0 V408.0 Q709.1,412 705.1,412 H678 Z" fill="#2A78D6"><title>Hy-MT2 1.8B: 1,133</title></path><text x="715.1" y="410" font-size="12" font-weight="400" fill="#1F2330">1,133</text><text x="670" y="431" font-size="12" text-anchor="end" font-weight="700" fill="#1F2330">知意 v2</text><path d="M678,420 H684.9 Q688.9,420 688.9,424.0 V429.0 Q688.9,433 684.9,433 H678 Z" fill="#6A5AE0"><title>知意 v2: 397</title></path><text x="694.9" y="431" font-size="12" font-weight="700" fill="#6A5AE0">397</text><line x1="678" y1="374" x2="678" y2="437" stroke="#C9CDD6"/><text x="28" y="467" font-size="11.5" fill="#6B7180">知意 v2 = 以 NiuTrans LMT-60-0.6B 为底座、用 Hy-MT2-7B 对 115 万条候选的译文蒸馏出的模型（输入法 1.3.0 起使用）；</text><text x="28" y="484" font-size="11.5" fill="#6B7180">Hy-MT2 1.8B 是之前用的第 1 版，7B 是蒸馏用的老师（没有发布）。测试候选是语言包查不到的真实候选（短词、一口气</text><text x="28" y="501" font-size="11.5" fill="#6B7180">打出的整句和英文词，带光标前的上文），不在训练数据里。可接受率：三个模型的译文放在一起、打乱顺序、不显示模型名，</text><text x="28" y="518" font-size="11.5" fill="#6B7180">由 Claude 逐条判断能不能用（品牌名等原样保留、不显示也算对）。速度与占用：llama.cpp b11480（Vulkan 版），</text><text x="28" y="535" font-size="11.5" fill="#6B7180">一页 7 个候选并行，Ryzen 5 9600X / RTX 5070 Ti；7B 的 CPU 耗时取 289 条。</text></svg>
